name: Android build

on:
  push:
    branches: [main, "optimize/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM tests and assemble APKs
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease

      - name: Upload unsigned release and debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: NovelToon-v1.0.12-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14


  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: NovelToon-v1.0.12-apks
          path: release-assets

      - name: Prepare release APKs
        run: |
          debug_apk="$(find release-assets -type f -name 'app-debug.apk' -print -quit)"
          release_apk="$(find release-assets -type f -name 'app-release-unsigned.apk' -print -quit)"
          test -n "$debug_apk"
          test -n "$release_apk"
          cp "$debug_apk" release-assets/NovelToon-v1.0.12-debug.apk
          cp "$release_apk" release-assets/NovelToon-v1.0.12-release-unsigned.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.12
          name: NovelToon v1.0.12 - 小说书源闭环
          generate_release_notes: true
          body: |
            ## NovelToon v1.0.12

            ### 修复
            - 内置书源按字段构造，缺字段不再导致初始化失败，失败会显示在小说书架。
            - 默认启用维基文库公有领域书源，打通搜索、目录、正文和切章。
            - 搜索和阅读区分没有结果、规则错误和网络失败。

            ### APK
            - \`NovelToon-v1.0.12-debug.apk\`：调试安装包。
            - \`NovelToon-v1.0.12-release-unsigned.apk\`：未签名 Release 包，仅用于测试。

            > 仓库未提供发布签名密钥，因此 Release APK 未签名，不能直接覆盖已有签名版本。
          files: |
            release-assets/NovelToon-v1.0.12-debug.apk
            release-assets/NovelToon-v1.0.12-release-unsigned.apk
